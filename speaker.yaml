# ESP32 Sendspin Speaker
# Sendspin player for Music Assistant on an ESP32-A1S audio kit (ES8388
# codec) with a Waveshare 1.47" ST7789V screen and six keys.
# Needs ESPHome 2026.10 or later (Sendspin built in).

esphome:
  name: speaker-1
  friendly_name: Speaker_1
  project:
    name: boisti13.esp32-sendspin-speaker
    version: "0.6.1"
  on_boot:
    # After the ES8388 is set up: send the DAC to both outputs (speaker
    # and headphone). Set on the device, so it doesn't wait for Home
    # Assistant.
    priority: -100
    then:
      - select.set:
          id: dac_output
          option: "BOTH"
      # Boot chime (sounds/boot.wav), unless turned off with "Boot Sound".
      # The amplifier follows playback as for any other audio.
      - if:
          condition:
            switch.is_on: boot_sound
          then:
            - delay: 500ms
            - media_player.play_media:
                id: speaker_1_player
                media_url: "audio-file://boot_chime"
            # The chime stays in the player's playlist and play/pause
            # would replay it: once it has ended, stop the player, which
            # empties the playlist (unless something else plays by then)
            - wait_until:
                condition:
                  media_player.is_playing: speaker_1_player
                timeout: 3s
            - wait_until:
                condition:
                  not:
                    media_player.is_playing: speaker_1_player
                timeout: 5s
            - if:
                condition:
                  media_player.is_idle: speaker_1_player
                then:
                  - media_player.stop: speaker_1_player

esp32:
  board: esp-wrover-kit
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

api:
  encryption:
    key: !secret speaker_1_key

ota:
  - platform: esphome
    password: !secret speaker_1_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # No power saving: it causes dropouts while streaming
  power_save_mode: none
  ap:
    ssid: "Speaker-1 Fallback Hotspot"
    password: !secret ap_password

captive_portal:

logger:
  level: INFO

globals:
  # Last volume drawn on the screen, in %
  - id: last_vol
    type: int
    initial_value: '-1'

  # True while the audio pipeline starts: the screen isn't redrawn then
  - id: playback_starting
    type: bool
    initial_value: 'false'

  # Whether the player was playing at the last state change; on_state also
  # fires on volume changes, so this tells real starts and stops apart
  - id: was_playing
    type: bool
    initial_value: 'false'

script:
  # Playback started: amplifier on once the codec has settled, one redraw
  # after the pipeline is up
  - id: playback_started
    mode: restart
    then:
      - lambda: 'id(playback_starting) = true;'
      - delay: 150ms
      - switch.turn_on: amp_power
      - delay: 1850ms
      - lambda: 'id(playback_starting) = false;'
      - component.update: tft_display

  # Playback stopped or paused: let the last audio play out before the
  # amplifier goes off (avoids the click)
  - id: playback_stopped
    mode: restart
    then:
      - script.stop: playback_started
      - lambda: 'id(playback_starting) = false;'
      - component.update: tft_display
      - delay: 300ms
      - if:
          condition:
            not:
              media_player.is_playing: speaker_1_player
          then:
            - switch.turn_off: amp_power

# --- Audio ---

i2c:
  id: bus_a
  sda: GPIO33
  scl: GPIO32
  frequency: 200kHz
  scan: true

audio_dac:
  - platform: es8388
    id: es8388_dac
    i2c_id: bus_a

select:
  - platform: es8388
    es8388_id: es8388_dac
    dac_output:
      id: dac_output
      name: "ES8388 DAC Output"
    adc_input_mic:
      name: "ES8388 ADC MIC Input"

i2s_audio:
  - id: i2s_out
    i2s_lrclk_pin: GPIO25
    i2s_bclk_pin: GPIO27
    i2s_mclk_pin: GPIO0    # the ES8388 needs MCLK

switch:
  - platform: gpio
    pin: GPIO21
    id: amp_power
    name: "Amplifier Power"
    restore_mode: ALWAYS_OFF

  # Play the chime at power-on; remembered across restarts
  - platform: template
    id: boot_sound
    name: "Boot Sound"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config

speaker:
  - platform: i2s_audio
    id: spk
    i2s_audio_id: i2s_out
    i2s_dout_pin: GPIO26
    audio_dac: es8388_dac
    dac_type: external
    channel: stereo
    sample_rate: 48000
    bits_per_sample: 32bit
    buffer_duration: 100ms

# --- Boot chime ---
# Built into the firmware (65 kB); made by scripts/make-boot-sound.py

audio_file:
  - id: boot_chime
    file: sounds/boot.wav

# --- Sendspin ---

sendspin:
  id: sendspin_hub
  task_stack_in_psram: true

media_source:
  - platform: sendspin
    id: sendspin_source
    # Audio buffered ahead, in bytes (default 1 MB, a few seconds). 2.5 MB
    # in PSRAM rides out Wi-Fi gaps of roughly 15-20 s.
    buffer_size: 2500000
  - platform: audio_file
    id: boot_chime_source

media_player:
  - platform: speaker_source
    name: Sendspin Media Player
    id: speaker_1_player
    volume_min: 0.4
    volume_max: 0.90
    media_pipeline:
      speaker: spk
      sources:
        - sendspin_source
        - boot_chime_source

    on_volume:
      - lambda: |-
          int v = (int) (x * 100.0f + 0.5f);
          if (v != id(last_vol)) {
            id(last_vol) = v;
            if (!id(playback_starting)) {
              id(tft_display).update();
            }
          }

    on_state:
      - lambda: |-
          bool playing = id(speaker_1_player).state ==
              media_player::MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING;
          if (playing == id(was_playing)) return;
          id(was_playing) = playing;
          if (playing) {
            id(playback_started).execute();
          } else {
            id(playback_stopped).execute();
          }

# --- Diagnostics ---

debug:
  update_interval: 60s

sensor:
  - platform: wifi_signal
    name: "Wi-Fi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
  - platform: debug
    psram:
      name: "Free PSRAM"
    free:
      name: "Free Heap"

text_sensor:
  - platform: wifi_info
    ip_address:
      id: wifi_ip

  - platform: sendspin
    id: ss_title
    type: title
    on_value:
      - if:
          condition:
            lambda: 'return !id(playback_starting);'
          then:
            - component.update: tft_display

  - platform: sendspin
    id: ss_artist
    type: artist
    on_value:
      - if:
          condition:
            lambda: 'return !id(playback_starting);'
          then:
            - component.update: tft_display

# --- Keys ---
# GPIO36/39 have pull-ups on the board (the ESP32 has none there).
# Button 2 (GPIO13) is used by the screen's SPI bus.
# Names start with the number printed on the board.

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO39
      inverted: true
      mode:
        input: true
    name: "Jack Status"

  - platform: gpio
    pin:
      number: GPIO36
      inverted: true
    name: "Button 1 Play/Pause"
    filters:
      - delayed_off: 10ms
    on_press:
      - media_player.toggle: speaker_1_player

  - platform: gpio
    pin:
      number: GPIO19
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Button 3 Previous Track"
    filters:
      - delayed_off: 10ms
    on_press:
      - media_player.previous: speaker_1_player

  - platform: gpio
    pin:
      number: GPIO23
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Button 4 Next Track"
    filters:
      - delayed_off: 10ms
    on_press:
      - media_player.next: speaker_1_player

  - platform: gpio
    pin:
      number: GPIO18
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Button 5 Volume Down"
    filters:
      - delayed_off: 10ms
    on_press:
      - media_player.volume_down: speaker_1_player

  - platform: gpio
    pin:
      number: GPIO5
      inverted: true
      mode:
        input: true
        pullup: true
    name: "Button 6 Volume Up"
    filters:
      - delayed_off: 10ms
    on_press:
      - media_player.volume_up: speaker_1_player

# --- Screen ---

spi:
  id: spi_tft
  clk_pin: GPIO14
  mosi_pin: GPIO13

font:
  # GF_Latin_Core: accented letters (ä, ö, ü, ß, é …) for titles and artists
  - file: "fonts/Ubuntu-Medium.ttf"
    id: font_big
    size: 26
    glyphsets: [GF_Latin_Core]
  - file: "fonts/Ubuntu-Medium.ttf"
    id: font_small
    size: 16
    glyphsets: [GF_Latin_Core]
  - file: "fonts/MaterialDesignIconsDesktop.ttf"
    id: mdi_icons
    size: 28
    glyphs:
      - "\U000F040A"  # play
      - "\U000F03E4"  # pause

display:
  - platform: st7789v
    id: tft_display
    spi_id: spi_tft
    model: Waveshare 1.47in 172X320
    width: 172
    height: 320
    cs_pin: GPIO15
    dc_pin: GPIO22
    reset_pin: GPIO12      # strapping pin: high at power-on stops the boot
    rotation: 90
    # Redrawn only when something changes (see the triggers above)
    update_interval: never
    lambda: |-
      it.fill(Color(0, 0, 0));

      const bool playing = id(speaker_1_player).state ==
          media_player::MediaPlayerState::MEDIA_PLAYER_STATE_PLAYING;
      const int vol = (int) (id(speaker_1_player).volume * 100.0f + 0.5f);
      std::string ip = id(wifi_ip).has_state() ? id(wifi_ip).state : "";
      std::string title = id(ss_title).has_state() ? id(ss_title).state : "";
      std::string artist = id(ss_artist).has_state() ? id(ss_artist).state : "";

      const int w = it.get_width();

      // Shortens text to fit the screen width, ending in "..."
      auto fit = [&](std::string s, esphome::display::BaseFont *font) {
        int x1, y1, tw, th;
        it.get_text_bounds(0, 0, s.c_str(), font, TextAlign::TOP_LEFT, &x1, &y1, &tw, &th);
        if (tw <= w - 16) return s;
        while (!s.empty()) {
          // drop one whole UTF-8 character
          do { s.pop_back(); } while (!s.empty() && (s.back() & 0xC0) == 0x80);
          std::string t = s + "...";
          it.get_text_bounds(0, 0, t.c_str(), font, TextAlign::TOP_LEFT, &x1, &y1, &tw, &th);
          if (tw <= w - 16) return t;
        }
        return s;
      };

      // Header: play/pause icon and volume
      it.printf(8, 8, id(mdi_icons), "%s", playing ? "\U000F03E4" : "\U000F040A");
      it.printf(w - 8, 6, id(font_small), TextAlign::TOP_RIGHT, "VOL %d%%", vol);

      it.printf(8, 32, id(font_small), "%s", ip.c_str());

      // Now playing
      it.printf(8, 95, id(font_big), "%s", fit(title, id(font_big)).c_str());
      it.printf(8, 140, id(font_small), "%s", fit(artist, id(font_small)).c_str());
